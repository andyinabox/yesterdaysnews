<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>yesterday's news</title>

    <meta name="description" content="yesterday's news" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <style>
      body {
        background-color: black;
        margin: 0;
        padding: 0;
      }
      video {
        background-color: transparent;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body class="index">
    <script>
      const YN_OBJECT_STORE_URL = 'https://localhost:9000'

      const manifestUrl = `${YN_OBJECT_STORE_URL}/manifest.json`

      async function getManifest() {
        try {
          const response = await fetch(manifestUrl)
          if (!response.ok) {
            throw new Error(`Response status: ${response.status}`)
          }

          const json = await response.json()
          return json
        } catch (error) {
          console.error(error.message)
        }
      }
      async function run() {
        const manifest = await getManifest()
        console.log(manifest)
        const clips = manifest.files.clips.map(
          (path) => `${YN_OBJECT_STORE_URL}/${path}`
        )

        function getNextVideoURL() {
          const n = Math.floor(Math.random() * clips.length)
          return clips.splice(n, 1)
        }

        const videoEl = document.createElement('video')
        const webmSourceEl = document.createElement('source')

        webmSourceEl.setAttribute('type', 'video/webm')
        webmSourceEl.setAttribute('src', getNextVideoURL())
        videoEl.appendChild(webmSourceEl)

        document.body.appendChild(videoEl)
        videoEl.play()

        videoEl.addEventListener('ended', (evt) => {
          videoEl.pause()

          webmSourceEl.setAttribute('type', 'video/webm')
          webmSourceEl.setAttribute('src', getNextVideoURL())

          videoEl.load()
          videoEl.play()

          console.log({
            src: webmSourceEl.getAttribute('src'),
            type: webmSourceEl.getAttribute('type'),
          })
        })
      }

      run()
    </script>
  </body>
</html>
